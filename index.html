<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
<title>Smart Mirror</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 鏡面の質感を演出する背景レイヤー（クリック等には反応しない） -->
  <div class="mirror-backdrop" aria-hidden="true">
    <div class="mirror-vignette"></div>
    <div class="mirror-sheen"></div>
    <div class="mirror-grain"></div>
  </div>

  <main class="mirror-grid">

    <!-- ============ 左上：日付・時刻 ============ -->
    <header class="panel header-panel" id="header-panel">
      <p class="eyebrow" id="greeting">&nbsp;</p>
      <div class="clock-wrap">
        <svg class="clock-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="clock-ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="clock-ring-fill" id="clock-ring-fill" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="clock-readout">
          <span class="time-main" id="time-main">--:--</span><span class="time-seconds" id="time-seconds">--</span>
        </div>
      </div>
      <p class="date-line" id="date-line">&nbsp;</p>

      <div class="day-progress" id="day-progress">
        <span class="day-progress-icon" title="日の出">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 18h16M6.5 18a5.5 5.5 0 0 1 11 0"/><path d="M12 8v4.2M8.5 9.5l1.3 1.3M15.5 9.5l-1.3 1.3"/><path d="M2.5 21h19" opacity="0.5"/></svg>
        </span>
        <div class="day-progress-track">
          <div class="day-progress-fill" id="day-progress-fill"></div>
          <div class="day-progress-now" id="day-progress-now"></div>
        </div>
        <span class="day-progress-icon" title="日の入り">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 18h16M6.5 18a5.5 5.5 0 0 1 11 0"/><path d="M12 13v-4M8.5 10.8 9.8 9.5M15.5 10.8l-1.3-1.3"/><path d="M2.5 21h19" opacity="0.5"/></svg>
        </span>
      </div>
      <div class="day-progress-labels">
        <span id="sunrise-label">--:--</span>
        <span id="sunset-label">--:--</span>
      </div>
    </header>

    <!-- ============ 右上：天気ヒーロー ============ -->
    <section class="panel weather-hero" id="weather-hero" aria-live="polite">
      <p class="eyebrow eyebrow-right" id="location-label">&nbsp;</p>
      <div class="weather-hero-main">
        <div class="weather-icon-lg" id="weather-icon-lg"></div>
        <div class="weather-temp-block">
          <span class="weather-temp" id="weather-temp">--<small>°</small></span>
          <span class="weather-desc" id="weather-desc">読み込み中…</span>
          <span class="weather-feelslike" id="weather-feelslike">&nbsp;</span>
        </div>
      </div>
      <div class="weather-sub-grid" id="weather-sub-grid"><!-- JSで生成 --></div>
    </section>

    <!-- ============ 右列：時間別・週間予報＋補助情報 ============ -->
    <div class="rightcol">
      <section class="panel forecast-panel" id="forecast-panel">
        <h2 class="panel-title">時間別予報</h2>
        <div class="hourly-strip" id="hourly-strip"></div>
        <div class="panel-divider"></div>
        <h2 class="panel-title">週間予報</h2>
        <div class="daily-strip" id="daily-strip"></div>
      </section>

      <section class="panel extras-panel" id="extras-panel">
        <div class="extra-tile" id="extra-aqi">
          <span class="extra-label">大気質</span>
          <span class="extra-value" id="extra-aqi-value">--</span>
        </div>
        <div class="extra-tile" id="extra-laundry">
          <span class="extra-label">洗濯指数</span>
          <span class="extra-value" id="extra-laundry-value">--</span>
        </div>
        <div class="extra-tile" id="extra-moon">
          <span class="extra-label">月齢</span>
          <span class="extra-value" id="extra-moon-value">--</span>
        </div>
        <div class="extra-tile" id="extra-outfit">
          <span class="extra-label">おでかけの目安</span>
          <span class="extra-value" id="extra-outfit-value">--</span>
        </div>
        <div class="extra-tile" id="extra-peak">
          <span class="extra-label">本日の最高・最低</span>
          <span class="extra-value" id="extra-peak-value">--</span>
        </div>
      </section>
    </div>

    <!-- ============ 左列：ニュース＋タスク ============ -->
    <div class="sidebar">
      <section class="panel news-panel" id="news-panel">
        <h2 class="panel-title">
          <span>ニュース</span>
          <span class="news-source" id="news-source">&nbsp;</span>
        </h2>
        <div class="news-viewport" id="news-viewport">
          <article class="news-article" id="news-article">
            <p class="news-headline">読み込み中…</p>
            <p class="news-summary"></p>
          </article>
        </div>
        <div class="news-meta">
          <div class="news-progress"><div class="news-progress-fill" id="news-progress-fill"></div></div>
          <div class="news-dots" id="news-dots"></div>
        </div>
      </section>

      <section class="panel agenda-panel" id="agenda-panel">
        <h2 class="panel-title">タスク</h2>
        <div class="agenda-list" id="todo-list">
          <p class="agenda-empty">同期中…</p>
        </div>
        <div class="panel-divider"></div>
        <h2 class="panel-title">買い物リスト</h2>
        <div class="shopping-badges" id="shopping-badges">
          <p class="agenda-empty">同期中…</p>
        </div>
      </section>
    </div>

    <!-- ============ フッター：ステータス ============ -->
    <footer class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">起動中…</span>
    </footer>

  </main>

  <!-- ============ 警告通知（天気急変）
       画面には一切触れられない前提のため、ボタン操作は要求しない。
       自動で「目立つ表示 → 数秒後に端へ小さく収納」という流れにし、
       危険が続く間は隅に小さなバッジとして表示し続ける。 ============ -->
  <div class="alert-overlay" id="alert-overlay" aria-hidden="true">
    <div class="alert-card" id="alert-card">
      <div class="alert-details" id="alert-details">
        <div class="alert-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 3 1 21h22L12 3Z" stroke-linejoin="round"/>
            <path d="M12 9.5v5" stroke-linecap="round"/>
            <circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <p class="alert-eyebrow">天気急変アラート</p>
        <p class="alert-title" id="alert-title"></p>
        <p class="alert-body" id="alert-body"></p>
      </div>
      <div class="alert-compact" id="alert-compact">
        <svg class="alert-compact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 3 1 21h22L12 3Z" stroke-linejoin="round"/>
          <path d="M12 9.5v5" stroke-linecap="round"/>
          <circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/>
        </svg>
        <span class="alert-compact-text" id="alert-compact-text"></span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
